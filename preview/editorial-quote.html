<!doctype html>
<!-- @dsCard group="Components" name="Editorial Quote" subtitle="Brand quote block" viewport="700x270" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Editorial Quote</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--beige-soft); }
  .card { width:700px; padding:48px 56px; box-sizing:border-box; text-align:center; position:relative;}
  .star { width:24px; height:24px; margin:0 auto 18px; display:block;}
  .quote { font-family: var(--serif); font-weight:300; font-style: italic; font-size:34px; line-height:1.22; letter-spacing:-.012em; color: var(--ink); text-wrap: balance;}
  .attrib { font-family: var(--sans); font-size:10px; letter-spacing:.32em; text-transform:uppercase; color: var(--earth); margin-top: 22px;}
  .rule { width:36px; height:1px; background: var(--ink); margin: 22px auto 12px; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <svg class="star" viewBox="0 0 100 100" fill="#3E3F3F"><path d="M50 4 C 52 32, 58 42, 96 50 C 58 58, 52 68, 50 96 C 48 68, 42 58, 4 50 C 42 42, 48 32, 50 4 Z"/></svg>
    <div class="quote">"En este espacio de ensueño, cada rincón es un relato esperando ser desvelado."</div>
    <div class="rule"></div>
    <div class="attrib">Spacio AM · Filosofía de marca</div>
  </div>
</body></html>
