<!doctype html>
<!-- @dsCard group="Type" name="Body — Montserrat" subtitle="Eyebrow, H4, body, caption with wide tracking" viewport="700x260" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Body Type (Montserrat)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--alabaster); }
  .card { width:700px; padding:32px 36px; box-sizing:border-box; display:grid; grid-template-columns: 140px 1fr; gap: 14px 24px; align-items: baseline; }
  .meta { font-family: var(--sans); font-size: 10px; letter-spacing:.24em; text-transform:uppercase; color: var(--earth); }
  .s   { font-family: var(--sans); color: var(--ink); letter-spacing:.14em; line-height:1.55; }
  .eye { font-family: var(--sans); font-size:11px; letter-spacing:.32em; text-transform:uppercase; color: var(--earth); }
  .h4  { font-family: var(--sans); font-size:18px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color: var(--ink); }
  .body{ font-family: var(--sans); font-size:14px; font-weight:400; letter-spacing:.14em; color: var(--ink); line-height:1.7; }
  .cap { font-family: var(--sans); font-size:12px; font-weight:400; letter-spacing:.14em; color: var(--earth); }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="meta">Eyebrow · 11</div><div class="eye">Filosofía de marca</div>
    <div class="meta">H4 · 18</div><div class="h4">Hospitalidad emocional</div>
    <div class="meta">Body · 14</div><div class="body">Cuidamos cada detalle, desde la luz de la mañana hasta el aroma de un café recién hecho, para que cada huésped sienta que ya conocía este lugar.</div>
    <div class="meta">Caption · 12</div><div class="cap">Antigua Guatemala — Suite editorial · Marzo 2026</div>
  </div>
</body></html>
