<!doctype html>
<!-- @dsCard group="Components" name="Navigation" subtitle="Pill nav + blur-glass variant" viewport="700x210" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--alabaster); }
  .card { width:700px; padding:18px 28px; box-sizing:border-box; display:flex; flex-direction:column; gap:14px;}
  .nav { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-radius:999px; background: rgba(250,250,250,0.72); backdrop-filter: blur(20px) saturate(120%); box-shadow: 0 4px 16px rgba(62,63,63,0.05); }
  .nav.solid { background: var(--alabaster); box-shadow: inset 0 0 0 1px var(--ink-08); }
  .brand { font-family: var(--serif); font-size:18px; letter-spacing:.04em; color: var(--ink); display:flex; align-items:center; gap:8px; white-space: nowrap; flex-shrink: 0;}
  .brand .star { width:10px; height:10px; }
  .links { display:flex; gap:24px; }
  .links a { font-family: var(--sans); font-size:10.5px; letter-spacing:.32em; text-transform:uppercase; color: var(--ink); text-decoration:none;}
  .links a.active { color: var(--peach);}
  .cta { font-family: var(--sans); font-size:10px; letter-spacing:.24em; text-transform:uppercase; padding:10px 18px; border-radius:999px; background: var(--ink); color: var(--alabaster);}
  .bg-stage { padding:14px; background: linear-gradient(90deg, var(--beige-soft), var(--alabaster)); border-radius:18px; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="bg-stage">
      <div class="nav">
        <div class="brand"><svg class="star" viewBox="0 0 100 100" fill="#3E3F3F"><path d="M50 4 C 52 32, 58 42, 96 50 C 58 58, 52 68, 50 96 C 48 68, 42 58, 4 50 C 42 42, 48 32, 50 4 Z"/></svg> Spacio AM</div>
        <div class="links"><a href="#" class="active">Filosofía</a><a href="#">Propiedades</a><a href="#">Servicios</a><a href="#">Contacto</a></div>
        <div class="cta">Reservar</div>
      </div>
    </div>
    <div class="nav solid">
      <div class="brand"><svg class="star" viewBox="0 0 100 100" fill="#3E3F3F"><path d="M50 4 C 52 32, 58 42, 96 50 C 58 58, 52 68, 50 96 C 48 68, 42 58, 4 50 C 42 42, 48 32, 50 4 Z"/></svg> Spacio AM</div>
      <div class="links"><a href="#">Filosofía</a><a href="#" class="active">Propiedades</a><a href="#">Servicios</a><a href="#">Contacto</a></div>
      <div class="cta">Reservar</div>
    </div>
  </div>
</body></html>
