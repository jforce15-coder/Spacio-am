<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Brand glyphs + Lucide UI set" viewport="700x260" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--alabaster); }
  .card { width:700px; padding:28px 32px; box-sizing:border-box; display:grid; grid-template-columns: 1.1fr 2fr; gap:24px; align-items: stretch;}
  .panel { border-radius:14px; padding:18px; box-shadow: inset 0 0 0 1px var(--ink-08); display:flex; flex-direction:column; gap:14px;}
  .lbl { font-family: var(--sans); font-size:10px; letter-spacing:.32em; text-transform:uppercase; color: var(--earth);}
  .row { display:flex; gap:18px; align-items:center; }
  .glyph { width:36px; height:36px; display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .row .glyph svg { width:100%; height:100%; }
  .ui { display:grid; grid-template-columns: repeat(6, 1fr); gap:16px 8px; }
  .icon { width:28px; height:28px; color: var(--ink); }
  .name { font-family: var(--sans); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color: var(--earth); margin-top:6px;}
  .ui .cell { display:flex; flex-direction:column; align-items:center;}
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="panel">
      <div class="lbl">Brand glyphs</div>
      <div class="row">
        <div class="glyph"><svg viewBox="0 0 100 100" fill="currentColor"><path d="M50 4 C 52 32, 58 42, 96 50 C 58 58, 52 68, 50 96 C 48 68, 42 58, 4 50 C 42 42, 48 32, 50 4 Z"/></svg></div>
        <div class="glyph"><img src="../assets/logo-monogram.svg" style="width:100%; height:100%; object-fit:contain;" alt=""></div>
        <div class="glyph"><img src="../assets/star.svg" style="width:100%; height:100%; object-fit:contain;" alt=""></div>
      </div>
      <div style="font-family:var(--sans); font-size:10.5px; letter-spacing:.14em; color: var(--ink);">Sparkle · Monogram · Star</div>
    </div>
    <div class="panel">
      <div class="lbl">UI Icons · Lucide · 1.25 stroke</div>
      <div class="ui">
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg><div class="name">arrow</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg><div class="name">plus</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg><div class="name">close</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg><div class="name">calendar</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg><div class="name">pin</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><div class="name">chevron</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><div class="name">check</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><div class="name">search</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7.07 17 2.51-7.39L21 11.07Z"/></svg><div class="name">send</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><div class="name">user</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg><div class="name">box</div></div>
        <div class="cell"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg><div class="name">home</div></div>
      </div>
    </div>
  </div>
</body></html>
