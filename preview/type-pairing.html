<!doctype html>
<!-- @dsCard group="Type" name="Type Pairing" subtitle="Valky + Montserrat editorial pairing" viewport="700x260" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Type Pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--beige-soft); }
  .card { width:700px; padding:44px 48px; box-sizing:border-box; }
  .eye { font-family: var(--sans); font-size:10px; letter-spacing:.32em; text-transform:uppercase; color: var(--earth); }
  .h   { font-family: var(--serif); font-weight:400; font-size:54px; line-height:1.05; letter-spacing:-.012em; color: var(--ink); margin:14px 0 18px; text-wrap: balance; }
  .p   { font-family: var(--sans); font-weight:400; font-size:13px; letter-spacing:.14em; line-height:1.75; color: var(--ink); max-width: 460px; }
  .rule{ width:64px; height:1px; background: var(--ink); margin: 22px 0 0; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="eye">Diseño · Hospitalidad · Experiencia</div>
    <h2 class="h">Hay espacios en donde sueñas con volver a despertar.</h2>
    <p class="p">Cada propiedad se cura con una intención editorial: una narrativa que conecta luz, textura y silencio. Diseño que se siente como hogar, hospitalidad que se siente como una carta escrita a mano.</p>
    <div class="rule"></div>
  </div>
</body></html>
