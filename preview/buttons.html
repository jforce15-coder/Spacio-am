<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Píldora · primario, acento (peach-deep), secundario, texto" viewport="720x280" -->
<html lang="es"><head>
<meta charset="utf-8">
<title>Spacio AM v2 — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; background:var(--alabaster); }
  .card{ width:720px; padding:32px; box-sizing:border-box; display:flex; flex-direction:column; gap:18px; }
  .rowb{ display:flex; align-items:center; gap:14px; }
  .btn{ font-family:var(--sans); font-size:11px; letter-spacing:.24em; text-transform:uppercase; padding:14px 28px; border-radius:var(--r-pill); cursor:pointer; border:none; transition:all var(--d-fast) var(--ease); }
  .b-primary  { background:var(--ink); color:var(--accent-contrast); }
  .b-accent   { background:var(--accent-solid); color:#fff; }         /* peach-deep · AA 5.0 */
  .b-secondary{ background:transparent; color:var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .b-danger   { background:var(--error); color:#fff; }
  .b-disabled { background:var(--warm-grey); color:var(--fg-subtle); cursor:not-allowed; }
  .b-text     { background:transparent; color:var(--ink); padding:8px 0; letter-spacing:.18em; border-bottom:1px solid var(--ink); border-radius:0; }
  .lbl{ font-family:var(--sans); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--fg-muted); width:96px; }
</style></head>
<body class="spacio">
  <div class="card">
    <div class="rowb"><div class="lbl">Primario</div><button class="btn b-primary">Reservar estadía</button><button class="btn b-secondary">Ver propiedades</button></div>
    <div class="rowb"><div class="lbl">Acento</div><button class="btn b-accent">Hablemos</button><button class="btn b-danger">Eliminar</button></div>
    <div class="rowb"><div class="lbl">Estado</div><button class="btn b-disabled" disabled>Próximamente</button><button class="btn b-text">Leer la historia</button></div>
    <div style="font-family:var(--sans); font-size:11px; letter-spacing:.02em; color:var(--fg-muted); line-height:1.6; margin-top:4px">
      El acento sólido usa <b>peach-deep #C83E1E</b> (no el peach original) para pasar contraste AA con texto blanco. El peach #E9826A queda solo para acento gráfico.
    </div>
  </div>
</body></html>
