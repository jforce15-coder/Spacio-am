<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="8px base — s-1 through s-10" viewport="700x300" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--alabaster); }
  .card { width:700px; padding:28px 32px; box-sizing:border-box; }
  .row { display:flex; align-items:center; gap:14px; padding:8px 0; }
  .label { width:100px; font-family: var(--sans); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color: var(--earth); }
  .bar { height:12px; background: var(--ink); border-radius:2px; }
  .num { font-family: var(--sans); font-size:11px; letter-spacing:.14em; color: var(--ink); margin-left: 10px; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="row"><div class="label">s-1</div><div class="bar" style="width:4px"></div><div class="num">4 px</div></div>
    <div class="row"><div class="label">s-2</div><div class="bar" style="width:8px"></div><div class="num">8</div></div>
    <div class="row"><div class="label">s-3</div><div class="bar" style="width:16px"></div><div class="num">16</div></div>
    <div class="row"><div class="label">s-4</div><div class="bar" style="width:24px"></div><div class="num">24</div></div>
    <div class="row"><div class="label">s-5</div><div class="bar" style="width:32px"></div><div class="num">32</div></div>
    <div class="row"><div class="label">s-6</div><div class="bar" style="width:48px"></div><div class="num">48</div></div>
    <div class="row"><div class="label">s-7</div><div class="bar" style="width:64px"></div><div class="num">64</div></div>
    <div class="row"><div class="label">s-8</div><div class="bar" style="width:96px"></div><div class="num">96</div></div>
    <div class="row"><div class="label">s-9</div><div class="bar" style="width:128px"></div><div class="num">128</div></div>
    <div class="row"><div class="label">s-10</div><div class="bar" style="width:192px"></div><div class="num">192</div></div>
  </div>
</body></html>
