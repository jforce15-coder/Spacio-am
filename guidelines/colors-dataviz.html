<!-- @dsCard group="Colors" viewport="700x210" name="Dataviz" subtitle="Una serie en peach; el resto, neutros cálidos" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Dataviz</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<div class="card">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">
<div><div style="height:46px;border-radius:var(--r-sm);background:var(--series-1)"></div><div class="lbl" style="margin-top:8px">base · ink</div><div class="mono">#3E3F3F</div></div>
<div><div style="height:46px;border-radius:var(--r-sm);background:var(--series-accent);box-shadow:0 0 0 2px var(--accent-tint)"></div><div class="lbl" style="margin-top:8px">accent · peach</div><div class="mono">la que importa</div></div>
<div><div style="height:46px;border-radius:var(--r-sm);background:var(--series-6)"></div><div class="lbl" style="margin-top:8px">2 · graphite</div><div class="mono">#6F6867</div></div>
<div><div style="height:46px;border-radius:var(--r-sm);background:var(--series-2)"></div><div class="lbl" style="margin-top:8px">3 · earth</div><div class="mono">#938B8A</div></div>
<div><div style="height:46px;border-radius:var(--r-sm);background:var(--series-3)"></div><div class="lbl" style="margin-top:8px">4 · taupe</div><div class="mono">#B8B0AC</div></div>
<div><div style="height:46px;border-radius:var(--r-sm);background:var(--series-4)"></div><div class="lbl" style="margin-top:8px">5 · warm-grey</div><div class="mono">#D8D4CE</div></div>
</div>
<div style="margin-top:18px;display:flex;align-items:flex-end;gap:8px;height:56px">
<div style="flex:1;height:62%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div style="flex:1;height:70%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div style="flex:1;height:66%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div style="flex:1;height:78%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div style="flex:1;height:74%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div style="flex:1;height:88%;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--accent);box-shadow:none"></div>
</div>
<div class="mono" style="margin-top:14px">No es una paleta categórica: es jerarquía. Una serie en peach por gráfica — la que quieres que se vea. El resto no compite.</div></div></body></html>
