<!-- @dsCard group="Colors" viewport="700x150" name="Neutros" subtitle="Neutros de marca con su ratio de contraste" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Colores de marca</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<!-- card -->
<div class="card"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">
<div><div style="height:66px;border-radius:var(--r-md);background:var(--color-ink);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:9px">ink</div><div class="mono">#3E3F3F</div><div class="mono" style="color:var(--fg-subtle)">10.1:1</div></div><div><div style="height:66px;border-radius:var(--r-md);background:var(--color-graphite);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:9px">graphite</div><div class="mono">#6F6867</div><div class="mono" style="color:var(--fg-subtle)">5.2:1</div></div><div><div style="height:66px;border-radius:var(--r-md);background:var(--color-earth);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:9px">earth</div><div class="mono">#938B8A</div><div class="mono" style="color:var(--fg-subtle)">solo ≥18px</div></div><div><div style="height:66px;border-radius:var(--r-md);background:var(--color-warm-grey);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:9px">warm-grey</div><div class="mono">#D8D4CE</div><div class="mono" style="color:var(--fg-subtle)">nunca texto</div></div><div><div style="height:66px;border-radius:var(--r-md);background:var(--color-alabaster);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:9px">alabaster</div><div class="mono">#FAFAFA</div><div class="mono" style="color:var(--fg-subtle)">fondo</div></div>
</div></div></body></html>
