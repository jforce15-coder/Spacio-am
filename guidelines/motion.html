<!-- @dsCard group="Spacing" viewport="700x180" name="Movimiento" subtitle="Un easing, tres duraciones" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Movimiento</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<div class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
<div style="padding:16px;border-radius:var(--r-md);background:var(--bg-alt)"><div class="lbl">d-fast</div><div style="font-family:var(--font-sans);font-size:22px;font-weight:600;color:var(--fg);margin-top:6px">180ms</div><div class="mono" style="margin-top:6px">hover, focus, toggles</div></div><div style="padding:16px;border-radius:var(--r-md);background:var(--bg-alt)"><div class="lbl">d-med</div><div style="font-family:var(--font-sans);font-size:22px;font-weight:600;color:var(--fg);margin-top:6px">360ms</div><div class="mono" style="margin-top:6px">colapsables, modales, cards</div></div><div style="padding:16px;border-radius:var(--r-md);background:var(--bg-alt)"><div class="lbl">d-slow</div><div style="font-family:var(--font-sans);font-size:22px;font-weight:600;color:var(--fg);margin-top:6px">720ms</div><div class="mono" style="margin-top:6px">transiciones de pantalla</div></div>
</div><div class="mono" style="margin-top:14px">Un solo easing: --ease cubic-bezier(0.22, 0.61, 0.36, 1). Fades y desplazamientos cortos; nunca bounce. Respeta prefers-reduced-motion.</div></div></body></html>
