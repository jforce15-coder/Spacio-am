<!-- @dsCard group="Colors" viewport="700x150" name="Capa semántica" subtitle="Los tokens que consumen los componentes" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Capa semántica</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<div class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 22px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--bg</span><span class="mono">alabaster</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--bg-alt</span><span class="mono">beige</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--surface</span><span class="mono">white</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--fg);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--fg</span><span class="mono">ink</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--fg-muted);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--fg-muted</span><span class="mono">graphite</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--fg-subtle);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--fg-subtle</span><span class="mono">earth</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--accent);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--accent</span><span class="mono">peach</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--accent-solid);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--accent-solid</span><span class="mono">peach-deep</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:8px;background:var(--divider);box-shadow:inset 0 0 0 1px var(--color-ink-08);flex-shrink:0"></span><span><span class="lbl" style="display:block">--divider</span><span class="mono">warm-grey</span></span></div>
</div></div></body></html>
