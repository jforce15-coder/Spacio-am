<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<div class="card">
<div style="display:flex;align-items:center;gap:40px;flex-wrap:wrap">
<img src="../assets/brand/logo-stacked.png" alt="Spacio AM" style="height:96px">
<img src="../assets/brand/logo-primary-transparent.png" alt="Spacio AM" style="height:52px">
<img src="../assets/brand/logo-stamp-transparent.png" alt="" style="height:74px">
<img src="../assets/brand/logo-monogram.png" alt="" style="height:74px">
</div>
<div style="display:flex;align-items:center;gap:40px;flex-wrap:wrap;margin-top:22px;padding:20px 24px;background:var(--color-ink);border-radius:var(--r-md)">
<img src="../assets/brand/logo-stacked-white.png" alt="Spacio AM" style="height:76px">
<img src="../assets/brand/logo-primary-white.png" alt="Spacio AM" style="height:44px">
<img src="../assets/brand/logo-stamp-white.png" alt="" style="height:64px">
<img src="../assets/brand/logo-monogram-white.png" alt="" style="height:64px">
</div>
<div class="mono" style="margin-top:16px"><b>Principal:</b> el apilado (SPACIO sobre A—M con sparkle). El horizontal queda para firmas anchas. El nombre es <b>Spacio AM</b>, nunca “Espacio AM”. Sobre ink o foto, versión blanca. Nunca el logo en peach.</div>
</div>
</div></body></html>
