<!-- @dsCard group="Spacing" viewport="700x180" name="Sombras" subtitle="Cuatro niveles con tinte ink" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sombras</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<div class="card" style="background:var(--bg)"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px">
<div><div style="height:70px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-xs)"></div><div class="lbl" style="margin-top:12px">shadow-xs</div><div class="mono">reposo mínimo, chips</div></div><div><div style="height:70px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-sm)"></div><div class="lbl" style="margin-top:12px">shadow-sm</div><div class="mono">card en reposo</div></div><div><div style="height:70px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-md)"></div><div class="lbl" style="margin-top:12px">shadow-md</div><div class="mono">hover, paneles flotantes</div></div><div><div style="height:70px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-lg)"></div><div class="lbl" style="margin-top:12px">shadow-lg</div><div class="mono">modal</div></div>
</div><div class="mono" style="margin-top:16px">Cuatro niveles, todos con tinte ink. Nunca sombra en tipografía.</div></div></body></html>
