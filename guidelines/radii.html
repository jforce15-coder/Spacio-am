<!-- @dsCard group="Spacing" viewport="700x160" name="Radios" subtitle="Píldora, 14 de facto, 28 para grandes" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Radios</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg)}.card{width:700px;box-sizing:border-box;padding:24px 26px}.lbl{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--fg-muted)}.mono{font-family:var(--font-sans);font-size:10px;letter-spacing:.06em;color:var(--fg-muted)}</style>
</head><body class="spacio">
<div class="card"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px">
<div><div style="height:60px;border-radius:var(--r-sm);background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:8px">r-sm</div><div class="mono">10 · celdas, chips</div></div><div><div style="height:60px;border-radius:var(--r-md);background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:8px">r-md</div><div class="mono">14 · inputs, cards</div></div><div><div style="height:60px;border-radius:var(--r-lg);background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:8px">r-lg</div><div class="mono">18 · paneles, tiles</div></div><div><div style="height:60px;border-radius:var(--r-xl);background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:8px">r-xl</div><div class="mono">28 · cards grandes, modales</div></div><div><div style="height:60px;border-radius:var(--r-2xl);background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:8px">r-2xl</div><div class="mono">40 · contenedores hero</div></div><div><div style="height:60px;border-radius:var(--r-pill);background:var(--bg-alt);box-shadow:inset 0 0 0 1px var(--color-ink-08)"></div><div class="lbl" style="margin-top:8px">r-pill</div><div class="mono">999 · botones, badges</div></div>
</div><div class="mono" style="margin-top:14px">--r-card-top 28px 28px 0 0 para media superior de card.</div></div></body></html>
