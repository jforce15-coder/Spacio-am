<!doctype html>
<!-- @dsCard group="Type" name="Display — Valky" subtitle="Serif scale, Light → Semibold" viewport="700x340" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Display Type (Valky)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--alabaster); }
  .card { width:700px; padding:36px 36px 32px; box-sizing:border-box; }
  .row { display:flex; align-items:baseline; gap:18px; padding:14px 0; border-bottom: 1px solid var(--ink-08); }
  .row:last-child { border-bottom:0; padding-bottom:0; }
  .meta { width:120px; flex-shrink:0; font-family: var(--sans); font-size: 10px; letter-spacing:.24em; text-transform:uppercase; color: var(--earth); }
  .specimen { font-family: var(--serif); color: var(--ink); line-height:1; letter-spacing:-.01em; }
  .s1 { font-size: 88px; font-weight: 300; }
  .s2 { font-size: 52px; font-weight: 400; }
  .s3 { font-size: 32px; font-weight: 500; font-style: italic; }
  .s4 { font-size: 22px; font-weight: 600; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="row"><div class="meta">Valky · Light · 88</div><div class="specimen s1">Spacio</div></div>
    <div class="row"><div class="meta">Regular · 52</div><div class="specimen s2">Hay espacios</div></div>
    <div class="row"><div class="meta">Italic · 32</div><div class="specimen s3">en donde sueñas</div></div>
    <div class="row"><div class="meta">Semibold · 22</div><div class="specimen s4">con volver a despertar.</div></div>
  </div>
</body></html>
