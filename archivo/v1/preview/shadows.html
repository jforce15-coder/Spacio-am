<!doctype html>
<!-- @dsCard group="Spacing" name="Shadow System" subtitle="Four levels, very soft" viewport="700x190" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--beige-soft); }
  .card { width:700px; padding:36px 32px; box-sizing:border-box; display:grid; grid-template-columns: repeat(4, 1fr); gap:18px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .box { width:100px; height:80px; background: var(--alabaster); border-radius:14px; }
  .xs { box-shadow: 0 1px 2px rgba(62,63,63,0.04); }
  .sm { box-shadow: 0 4px 16px rgba(62,63,63,0.05); }
  .md { box-shadow: 0 12px 40px rgba(62,63,63,0.07); }
  .lg { box-shadow: 0 28px 80px rgba(62,63,63,0.10); }
  .lbl { font-family: var(--sans); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color: var(--earth); text-align:center; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="item"><div class="box xs"></div><div class="lbl">xs<br>flat</div></div>
    <div class="item"><div class="box sm"></div><div class="lbl">sm<br>resting card</div></div>
    <div class="item"><div class="box md"></div><div class="lbl">md<br>hovered</div></div>
    <div class="item"><div class="box lg"></div><div class="lbl">lg<br>modal</div></div>
  </div>
</body></html>
