<!doctype html>
<!-- @dsCard group="Brand" name="Logo Lockups" subtitle="Wordmark, monogram, stamp" viewport="700x280" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>Spacio AM — Logo Lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background: var(--alabaster); }
  .card { width:700px; padding:40px 32px; box-sizing:border-box; display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap:18px; align-items: stretch; }
  .panel { border-radius:18px; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:220px; gap:14px; }
  .a { background: var(--alabaster); box-shadow: inset 0 0 0 1px var(--ink-08); }
  .b { background: var(--beige-soft); }
  .c { background: var(--ink); }
  .c .lbl { color: var(--warm-grey);}
  .lbl { font-family: var(--sans); font-size:10px; letter-spacing:.32em; text-transform:uppercase; color: var(--earth);}
  img { display:block; }
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="panel a"><img src="../assets/logo-primary.svg" width="260" alt="Primary wordmark" /><div class="lbl">Primary wordmark</div></div>
    <div class="panel b"><img src="../assets/logo-monogram.svg" width="80" alt="S monogram" /><div class="lbl">S monogram</div></div>
    <div class="panel c"><img src="../assets/logo-stamp.jpeg" width="120" alt="Circular stamp" style="filter:invert(1) brightness(1.2);"/><div class="lbl">Circular stamp</div></div>
  </div>
</body></html>
