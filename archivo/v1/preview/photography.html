<style>

  .item { display:flex; flex-direction:column;}
</style>
</head>
<body class="spacio">
  <div class="card">
    <div class="item"><div class="ph" style="background-image:url('../assets/lifestyle-portrait-03.jpeg')"></div><div class="cap">Retrato · Equipo</div></div>
    <div class="item"><div class="ph" style="background-image:url('../assets/lifestyle-portrait-01.jpeg')"></div><div class="cap">Hora dorada</div></div>
    <div class="item"><div class="ph" style="background-image:url('../assets/lifestyle-team-02.jpeg')"></div><div class="cap">Brushstroke + sujeto</div></div>
    <div class="item"><div class="ph" style="background-image:url('../assets/merch-tote.jpeg')"></div><div class="cap">Producto editorial</div></div>
  </div>
