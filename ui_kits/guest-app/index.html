<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spacio AM — Guest App</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;background:var(--bg-alt)}
.g-shell{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:var(--shadow-md)}
.g-screen{padding:var(--s-4) var(--s-4) var(--s-7)}
.g-narrow{max-width:460px;margin:0 auto}
.g-top{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-4)}
.g-top .t-eyebrow,.g-top>*:last-child{margin-left:auto}
.g-back{background:transparent;border:1px solid var(--divider);border-radius:var(--r-pill);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0;margin-left:0}
.g-welcome{margin-top:var(--s-5)}
.g-steps{display:flex;align-items:center;justify-content:center;margin:0 auto var(--s-5);max-width:360px}
.g-step{display:flex;flex-direction:column;align-items:center;gap:8px}
.g-step-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;transition:all var(--d-med) var(--ease)}
.g-step-line{flex:1;height:1px;margin:0 8px 18px}
.g-nav{display:flex;gap:10px;margin-top:var(--s-5);justify-content:space-between}
.g-near{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media(max-width:520px){.g-near{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body class="spacio"><div id="root"></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Checkin.jsx"></script>
<script type="text/babel" src="Guide.jsx"></script>
<script type="text/babel" src="GuestApp.jsx"></script>
</body></html>
