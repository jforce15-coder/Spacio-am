<!-- @dsCard group="Owner Dashboard" viewport="1280x820" name="Dashboard de Propietarios" subtitle="Login, KPIs editoriales, financiero, ocupación y tabla-resumen" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spacio AM — Dashboard de Propietarios</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;background:var(--bg)}
.kit-tabs{max-width:var(--container-standard);margin:0 auto;padding:0 var(--s-4)}
.kit-main{max-width:var(--container-standard);margin:0 auto;padding:var(--s-6) var(--s-4) var(--s-7);overflow-x:hidden}
.kit-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--s-6);align-items:center;margin-bottom:var(--s-7)}
.kit-hero-all{height:240px;border-radius:var(--r-xl);background:var(--bg-alt);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--color-ink-08)}
.kit-hero-ctx{padding-left:var(--s-2)}
.kit-listing{display:inline-flex;align-items:center;gap:8px;margin-top:var(--s-4);font-family:var(--font-sans);font-size:11.5px;letter-spacing:var(--tr-normal);color:var(--fg-muted);text-decoration:none}
.kit-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s-3);margin-bottom:var(--s-8)}
.kit-kpis>*:first-child{grid-column:span 2}
.kit-section{margin-bottom:var(--s-8)}
.kit-fin{display:grid;grid-template-columns:1.7fr 1fr;gap:var(--s-4)}
.kit-highlights{display:flex;flex-direction:column;gap:var(--s-3)}
.kit-highlight{display:flex;gap:var(--s-3);align-items:flex-start;background:var(--bg-alt);border-radius:var(--r-md);padding:var(--s-3) var(--s-4)}
.kit-highlight-ic{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--accent-tint);display:grid;place-items:center}
.kit-occ{display:grid;grid-template-columns:1fr 1.3fr;gap:var(--s-4)}
.kit-footer{display:flex;align-items:center;gap:var(--s-4);justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--divider);padding-top:var(--s-4)}
.kit-login{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--bg)}
.kit-login-aside{display:none}
.kit-login-main{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:var(--s-6) var(--s-4);position:relative}
.kit-login-brush{position:absolute;top:16%;left:-20%;width:150%;opacity:.55;pointer-events:none;transform:rotate(-4deg)}
@media(min-width:880px){.kit-login{grid-template-columns:1.05fr 1fr}.kit-login-aside{display:flex;position:relative;overflow:hidden;background:var(--bg-alt);flex-direction:column;justify-content:space-between;padding:56px 56px 48px}}
@media(max-width:900px){.kit-hero,.kit-fin,.kit-occ{grid-template-columns:1fr}.kit-kpis>*:first-child{grid-column:span 1}}
/* mobile-first: nada de anchos fijos ni grids que no colapsen — el bug real de mi.spacioam.com en teléfono */
@media(max-width:780px){.kit-main{padding:var(--s-5) var(--s-3) 120px}.kit-kpis{grid-template-columns:1fr}.kit-hero-ctx{padding-left:0}}
img,svg,table{max-width:100%}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body class="spacio"><div id="root"></div>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Summary.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="DashboardApp.jsx"></script>
</body></html>
